# Builds the Astro site and publishes it to GitHub Pages.
# Runs on every push to `main`, and can be started by hand from the
# repo's Actions tab ("Run workflow").
#
# One-time setup on GitHub: Settings → Pages → Source → "GitHub Actions".

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The deploy job needs permission to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# If you push twice quickly, finish the running deploy before starting the next.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # Official Astro action: installs Node 24 and dependencies (from
      # package-lock.json), runs `astro build`, and uploads dist/.
      - name: Build the site
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
